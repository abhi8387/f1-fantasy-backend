<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>F1 Fantasy - Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="hero">
  <h1>🏁 F1 Fantasy</h1>
</header>

<section class="card auth-card">
  <div class="tabs">
    <button class="tab active" data-tab="loginTab">Login</button>
    <button class="tab" data-tab="registerTab">Register</button>
  </div>

  <form id="loginTab" class="tab-panel active">
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <form id="registerTab" class="tab-panel">
    <input type="text" id="regUsername" placeholder="Username" required />
    <input type="email" id="regEmail" placeholder="Email" required />
    <input type="password" id="regPassword" placeholder="Password (min 8, 1 upper, 1 lower, 1 number)" required />
    <button type="submit">Register</button>
  </form>

  <p id="authMessage" class="message"></p>
</section>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
