services:
  postgres:
    image: postgres:16-alpine
    container_name: f1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-f1admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-f1password}
      POSTGRES_DB: ${DB_NAME:-f1_fantasy}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-f1admin} -d ${DB_NAME:-f1_fantasy}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: f1-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: f1-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-f1admin}:${DB_PASSWORD:-f1password}@postgres:5432/${DB_NAME:-f1_fantasy}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

# Kafka + Kafka UI are added in the phase that introduces the event bus (race/scoring/leaderboard events).

volumes:
  postgres_data:
  redis_data:
