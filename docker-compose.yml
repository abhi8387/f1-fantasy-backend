services:
  mysql:
    image: mysql:8.0
    container_name: f1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-f1password}
      MYSQL_DATABASE: ${DB_NAME:-f1_fantasy}
      MYSQL_USER: ${DB_USER:-f1admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-f1password}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_PASSWORD:-f1password}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: f1-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: f1-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-f1_fantasy}
      DB_USER: ${DB_USER:-f1admin}
      DB_PASSWORD: ${DB_PASSWORD:-f1password}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public

# Kafka + Kafka UI are added in the phase that introduces the event bus (race/scoring/leaderboard events).

volumes:
  mysql_data:
  redis_data:
